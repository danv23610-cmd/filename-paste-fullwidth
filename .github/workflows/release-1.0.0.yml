name: Publish 1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin files
        uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 1.0.0 main.js manifest.json \
            --title "1.0.0" \
            --notes "Initial release of Filename Paste Fullwidth." \
            --target "$GITHUB_SHA"
